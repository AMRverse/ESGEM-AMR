<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESGEM AMR</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">

  <style>
    body {
      margin: 0;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8fa;
    }

    .sidebar {
      width: 260px;
      height: 100vh;
      overflow-y: auto;
      position: fixed;
      background: white;
      border-right: 1px solid #ddd;
      padding: 20px;
    }

    .sidebar h2 {
      font-size: 16px;
      margin-top: 0;
    }

    .sidebar a {
      display: block;
      text-decoration: none;
      color: #0366d6;
      margin: 6px 0;
      font-size: 14px;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    .content {
      margin-left: 280px;
      padding: 40px;
      max-width: 900px;
    }

    .markdown-body {
      background: white;
      padding: 40px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Contents</h2>
  <div id="nav"></div>
</div>

<div class="content">
  <div class="markdown-body" id="content">Loading...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
const url = "https://raw.githubusercontent.com/AMRverse/ESGEM-AMR/main/README.md";

fetch(url)
  .then(res => res.text())
  .then(md => {
    const html = marked.parse(md);
    document.getElementById("content").innerHTML = html;

    // Remove first H1 (repo title)
    const firstH1 = document.querySelector("#content h1");
    if (firstH1) firstH1.remove();

    generateNav();
  });

function generateNav() {
  const nav = document.getElementById("nav");
  const headings = document.querySelectorAll("#content h2, #content h3");

  headings.forEach(h => {
    const id = h.textContent
      .toLowerCase()
      .replace(/[^\w]+/g, "-");

    h.id = id;

    const link = document.createElement("a");
    link.href = "#" + id;
    link.textContent = h.textContent;

    // indent h3
    if (h.tagName === "H3") {
      link.style.marginLeft = "15px";
      link.style.fontSize = "13px";
    }

    nav.appendChild(link);
  });
}
</script>

</body>
</html>
